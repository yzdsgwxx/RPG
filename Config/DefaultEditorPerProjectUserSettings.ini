; =============================================================================
;  Live Coding / C++ 热重载 —— 项目约定：关闭
;
;  原因：
;    1. Windows 平台把 bEnabled 默认覆盖为 True
;       （Engine/Config/Windows/WindowsEditorPerProjectUserSettings.ini），
;       必须显式关闭。
;    2. 本项目的 C++ 改动统一用 UnrealBuildTool 全量/增量编译，
;       不在编辑器内做热重载，避免 Live Coding 的增量编译与
;       reinstancing 干扰 UnrealSharp 的托管程序集与已加载插件的状态。
;
;  注意：本文件是「项目默认值」。每个用户的本地值在
;       Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini，
;       若在编辑器偏好设置里改动过，需要同时改那里（或删掉本地那一段）。
; =============================================================================

[/Script/LiveCoding.LiveCodingSettings]
bEnabled=False
bAutomaticallyCompileNewClasses=False

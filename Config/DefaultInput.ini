; =============================================================================
;  输入方案：EnhancedInput
;
;  编辑器会把 DefaultPlayerInputClass 强制改回 EnhancedInput.*，
;  因此本项目统一使用 EnhancedInput，不再维护传统 Action/Axis Mapping。
;
;  按键映射在 C++ 侧构建（Source/RPG/RPGCharacterBase.cpp 的 EnsureInputAssets）：
;  ARPGCharacterBase 在运行时创建 IA_* / IMC_RPG，并注册到本地玩家的
;  EnhancedInput 子系统。当前绑定：
;    IA_MoveForward  W / S / 手柄左摇杆 Y      （Axis1D，S 经 Negate 取反）
;    IA_MoveRight    D / A / 手柄左摇杆 X      （Axis1D，A 经 Negate 取反）
;    IA_LookYaw      鼠标 X / 手柄右摇杆 X     （Axis1D）
;    IA_LookPitch    鼠标 Y / 手柄右摇杆 Y     （Axis1D）
;    IA_Jump         Space / 手柄 A            （Boolean）
;    IA_Sprint       LeftShift / 手柄左摇杆按下 （Boolean）
;
;  绑定与逻辑在 Script/ManagedRPG/ARPGCharacter.cs。
;  鼠标捕获/锁定沿用下面的 DefaultViewportMouseCaptureMode / LockMode。
; =============================================================================
DeprecatedActionAndAxisNames=()
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde


; =============================================================================
;  默认地图与游戏模式
;
;  目录约定（见 AGENTS.md 3.1）：
;    - 游戏框架类蓝图（PlayerPawn / PlayerController）直接放 **/Game/ 根目录**
;    - 地图放 /Game/Maps/
;
;  GameMode 使用项目自建的 **BP_RPGGameMode**（父类 = C# 的 ARPGGameMode）。
;  仍然不自定义 GameState / PlayerState（本项目用不到，见 AGENTS.md 3.1）。
;
;  为什么必须自定义 GameMode：引擎 GameModeBase 的 DefaultPawnClass 默认是 ADefaultPawn，
;  它会在 PlayerStart 生成一个占位 Pawn 并**抢先占据**玩家控制器，导致关卡里放置的
;  BP_RPGCharacter 抢不回控制权 —— 表现就是键盘鼠标全无响应。
;  BP_RPGGameMode 把「默认pawn类」设为 None，让关卡角色成为唯一 Pawn。
;
;  角色来源：/Game/Maps/NewMap 里放置了 BP_RPGCharacter 实例。
;  ARPGCharacter.BeginPlay 里的 EnsurePlayerPossession 仍保留为兜底（双保险）。
;  注意：不要把 NewMap 里的 BP_RPGCharacter 实例删掉，删了就没有 Pawn，输入会全无反应。
; =============================================================================
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/NewMap.NewMap
GameDefaultMap=/Game/Maps/NewMap.NewMap
GlobalDefaultGameMode=/Game/BP_RPGGameMode.BP_RPGGameMode_C


; =============================================================================
;  渲染设置
;  项目偏好：关闭 Lumen / Nanite 等次世代动态渲染管线。
;  如需恢复，把下列各项改回其默认值即可（已在注释中标注）。
; =============================================================================
[/Script/Engine.RendererSettings]
; 静态光照保持关闭，全部使用动态光照（默认 0）
r.AllowStaticLighting=0
; 距离场主要服务 Lumen/DFAO，关闭以缩短 DDC 构建时间（默认 True）
r.GenerateMeshDistanceFields=False
; Lumen 动态全局光照：0=None 关闭（默认 1=Lumen）
r.DynamicGlobalIlluminationMethod=0
; Lumen 反射：0=None 关闭（默认 1=Lumen）
r.ReflectionMethod=0
; Nanite 虚拟化几何体：关闭（默认 True）
r.Nanite.ProjectEnabled=False
; 虚拟阴影贴图：与 Nanite 配套的阴影方案，Nanite 关闭后一并关闭（默认 1）
r.Shadow.Virtual.Enable=0
; 光线追踪：本项目不使用，关闭以减少着色器编译量（默认 True）
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False
; Substrate 实验性材质系统：关闭（默认 False）
r.Substrate=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.SkinCache.CompileShaders=True

